name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test -- --watch=false

  e2e:
    runs-on: ubuntu-latest
    # Flowable 6.8.1 has no Docker image; 6.8.0 serves the same Modeler REST API.
    services:
      flowable:
        image: flowable/flowable-ui:6.8.0
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Flowable
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/flowable-ui/modeler-app/rest/account || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "Flowable is up"; exit 0; fi
            sleep 5
          done
          echo "Flowable did not start"; exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
